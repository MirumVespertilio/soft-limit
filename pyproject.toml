[project]
name = "soft-limit"
version = "0.1.0"
description = "Telegram Mini App with roulette"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiogram>=3.13.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.10.0",
]

[tool.setuptools.packages.find]
include = ["app*", "bot*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
