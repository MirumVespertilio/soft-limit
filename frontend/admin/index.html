<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Панель управления | Soft Limit</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/admin/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>Панель управления</h1>
            <div class="admin-badge">Admin</div>
        </header>

        <main id="main-content">
            <section id="admin-section" class="section">
                <div class="admin-tabs">
                    <button class="tab-btn active" data-tab="models">Модели</button>
                    <button class="tab-btn" data-tab="stats">Статистика</button>
                    <button class="tab-btn" data-tab="content">Контент</button>
                    <button class="tab-btn" data-tab="wheel">Колесо</button>
                    <button class="tab-btn" data-tab="media">Медиа</button>
                    <button class="tab-btn" data-tab="welcome">Привет. пул</button>
                    <button class="tab-btn" data-tab="users">Пользователи</button>
                    <button class="tab-btn" data-tab="packages">Пакеты</button>
                </div>

                <div id="admin-models" class="tab-content active">
                    <div class="admin-card glass-panel">
                        <div class="card-header">
                            <h3>Мои ИИ-Модели</h3>
                            <button id="add-model-btn" class="btn btn-primary btn-sm">+ Добавить модель</button>
                        </div>
                        <div id="models-list" class="items-list">
                            <p class="loading-text">Загрузка моделей...</p>
                        </div>
                    </div>
                </div>

                <div id="admin-dashboard" class="tab-content"></div>
                <div id="admin-stats" class="tab-content"></div>
                <div id="admin-content" class="tab-content"></div>
                <div id="admin-wheel" class="tab-content"></div>
                <div id="admin-media" class="tab-content"></div>
                <div id="admin-welcome" class="tab-content"></div>
                <div id="admin-users" class="tab-content"></div>
                <div id="admin-packages" class="tab-content"></div>
            </section>
        </main>
    </div>

    <!-- Модальное окно добавления/редактирования модели -->
    <div id="model-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <h3 id="modal-title">Новая модель</h3>
            <form id="model-form">
                <input type="hidden" id="model-id" value="">
                <div class="form-group">
                    <label for="model-name">Название модели</label>
                    <input type="text" id="model-name" class="input" placeholder="Например: Eva" required>
                </div>
                <div class="form-group">
                    <label for="model-token">Telegram Bot Token</label>
                    <input type="text" id="model-token" class="input" placeholder="123456:ABC-DEF1234...">
                </div>
                <div class="form-group">
                    <label for="model-theme">Тема (JSON)</label>
                    <textarea id="model-theme" class="input textarea" rows="4" placeholder='{"primary_color": "#ff007f", "accent": "#00ffcc"}'></textarea>
                </div>
                <div class="form-group">
                    <label for="model-price-gems">Медиа-спин (GEMS)</label>
                    <input type="number" id="model-price-gems" class="input" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label for="model-price-stars">Медиа-спин (Stars)</label>
                    <input type="number" id="model-price-stars" class="input" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label for="model-rarity-weights">Веса редкости (JSON)</label>
                    <textarea id="model-rarity-weights" class="input textarea" rows="3" placeholder='{"rare": 50, "legendary": 30, "mythic": 15, "eternal": 5}'></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" id="close-model-modal-btn" class="btn btn-secondary">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/admin/vendor/chart.umd.min.js"></script>
    <script src="/static/admin/app.js"></script>
</body>
</html>
