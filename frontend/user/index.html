<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soft Limit</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/user/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1 id="model-header-title">Soft Limit</h1>
            <div class="balances">
                <span class="balance"><span class="icon">💎</span><span id="gems-balance">0</span></span>
                <span class="balance"><span class="icon">🎰</span><span id="spins-balance">0</span></span>
            </div>
            <button id="daily-free-btn" class="btn btn-secondary btn-sm">🎁 Бесплатный спин</button>
        </header>

        <main id="main-content">
            <section id="wheel-section" class="section">
                <div class="wheel-container">
                    <canvas id="wheel-canvas" width="300" height="300"></canvas>
                    <div class="wheel-pointer"></div>
                </div>
                <button id="spin-btn" class="btn btn-primary">Крутить колесо (1 🎰)</button>
            </section>

            <section id="media-section" class="section hidden">
                <h2>Медиа-слоты</h2>
                <p class="section-hint">Выбирайте контент модели. Дубликаты возвращают GEMS.</p>
                <button id="media-spin-gems-btn" class="btn btn-primary">
                    Крутить за <span id="media-price-gems">0</span> 💎
                </button>
                <button id="media-spin-stars-btn" class="btn btn-secondary">
                    Крутить за <span id="media-price-stars">0</span> ⭐
                </button>
            </section>

            <section id="result-section" class="section hidden">
                <div class="result-card">
                    <span id="result-rarity" class="rarity-badge hidden"></span>
                    <img id="result-image" src="" alt="Result">
                    <h2 id="result-title"></h2>
                    <p id="result-description"></p>
                    <p id="result-reward" class="result-reward"></p>
                    <button id="result-close" class="btn btn-secondary">Закрыть</button>
                </div>
            </section>

            <section id="inventory-section" class="section hidden">
                <h2>Коллекция</h2>
                <div id="inventory-grid" class="inventory-grid"></div>
            </section>

            <section id="shop-section" class="section hidden">
                <h2>Магазин</h2>
                <div class="shop-tabs">
                    <button class="shop-tab-btn active" data-shop-tab="spins">Спины за GEMS</button>
                    <button class="shop-tab-btn" data-shop-tab="gems">Пополнить GEMS (⭐)</button>
                </div>
                <div id="packages-list" class="packages-list"></div>
                <div id="gem-packages-list" class="packages-list hidden"></div>
            </section>
        </main>

        <nav class="nav">
            <button class="nav-btn active" data-page="wheel">🎰</button>
            <button class="nav-btn" data-page="media">🎲</button>
            <button class="nav-btn" data-page="inventory">📦</button>
            <button class="nav-btn" data-page="shop">🛒</button>
        </nav>
    </div>

    <div id="confirm-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Подтверждение покупки</h3>
            <p id="confirm-text"></p>
            <div class="modal-actions">
                <button id="confirm-cancel" class="btn btn-secondary">Отмена</button>
                <button id="confirm-ok" class="btn btn-primary">Подтвердить покупку</button>
            </div>
        </div>
    </div>

    <script src="/static/user/app.js"></script>
</body>
</html>
